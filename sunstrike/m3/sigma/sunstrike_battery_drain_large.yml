title: "SUNSTRIKE D-BATTERY-DRAIN-LARGE — descarga remota >=50% SoC numa operacao (aproximacao: SoC resultante <=50)"
id: 329567f2-e82d-444f-92ee-dd7cb3f57253
status: experimental
description: >
    descarga remota >=50% SoC numa operacao (aproximacao: SoC resultante <=50). Lab SUNSTRIKE v0.7.5 (synthetic, loopback-only). Corre sobre os
    JSONL de evidencia (audit_dev_*, audit_gate, audit_guard) numa tabela
    `events` com as chaves de topo de cada linha como colunas. Mapeamento
    ATT&CK provisorio — reconfirmado no M5.
references:
    - https://github.com/malapeiro/llm-defensive-disclosures
    - "ATT&CK provisorio (reconfirmado no M5): T1485"
logsource:
    product: sunstrike
    service: audit
detection:
    sel:
        event: param_change
        param: soc
        provenance: remote_command
        new|lte: 50.0
    condition: sel
falsepositives:
    - aproximacao SEM aritmetica (old-new>=50 nao e expressivel em Sigma): dispara em qualquer descarga remota que ATERRA <=50, mesmo que a queda individual seja <50
level: medium
